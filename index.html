<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="西诺迪斯食品（上海）有限公司销售工作台，演示公司查询、Customer ID 线索关联和解绑。">
  <title>西诺迪斯食品（上海）有限公司 · 企业微信端与营销后台</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      font-synthesis: none;
      --canvas: #eef2f7; --surface: #fff; --ink: #18283e; --sub: #485c73; --muted: #63758b;
      --line: #e4eaf1; --stroke: #d5dfeb; --blue: #2370dc; --blue-strong: #125bbd; --blue-pale: #eaf3ff;
      --green: #176749; --green-pale: #e7f6ed; --red: #a72f39; --amber: #915116;
      --admin-accent: #bd492f; --admin-pale: #fff0eb;
      background: var(--canvas); color: var(--ink);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-size: 14px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid #7fa7fa; outline-offset: 3px; }
    svg.icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; vertical-align: middle; }
    svg.small { width: 14px; height: 14px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 23px; letter-spacing: -.025em; line-height: 1.3; }
    h2 { font-size: 16px; line-height: 1.4; }
    h3 { font-size: 14px; }
    .demo-bar { min-height: 59px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; padding: 8px clamp(14px, 3vw, 42px); background: #17283f; color: #eff5ff; }
    .demo-title { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 13px; font-weight: 700; line-height: 1.35; }
    .demo-title .brand-symbol { display: grid; place-items: center; flex: none; width: 29px; height: 29px; background: #29425f; color: #dbeafe; border-radius: 8px; }
    .demo-switch { display: flex; gap: 3px; padding: 3px; border: 1px solid #3a4c63; border-radius: 8px; background: #101f32; }
    .demo-switch a { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 13px; border-radius: 5px; color: #c8d6ea; font-size: 12px; font-weight: 650; white-space: nowrap; text-decoration: none; }
    .demo-switch a[aria-current="page"], .demo-switch a:hover { color: #fff; background: #385477; }
    .demo-reset { justify-self: end; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 6px; padding: 7px 8px; background: transparent; color: #d0dced; font-size: 12px; white-space: nowrap; }
    .demo-reset:hover { background: #2c405b; color: #fff; }
    .wecom-window {
      --wecom-blue: #1677e8;
      --wecom-blue-pressed: #1067d1;
      --wecom-surface: #f5f7fa;
      --wecom-divider: #e9edf3;
      display: grid;
      grid-template-columns: clamp(54px, 14vw, 64px) minmax(0, 1fr);
      grid-template-rows: auto minmax(0, 1fr);
      width: min(100%, 393px);
      height: min(852px, calc(100dvh - 99px));
      min-height: 360px;
      margin: 20px auto;
      overflow: hidden;
      background: #fff;
      border: 1px solid #dbe3ef;
      border-radius: 22px;
      box-shadow: 0 12px 36px #152a4c15;
    }
    .wecom-titlebar {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 60px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--wecom-divider);
      background: #fff;
    }
    .wecom-account { display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 9px; background: var(--wecom-blue); color: #fff; font-size: 15px; font-weight: 700; }
    .wecom-titlebar-copy { display: grid; min-width: 0; gap: 2px; }
    #wecom-window-title { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .profile-name { color: var(--muted); font-size: 11px; line-height: 1.35; }
    .wecom-columns { display: contents; }
    .wecom-panel { grid-column: 2; grid-row: 2; min-width: 0; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain; scrollbar-width: thin; background: var(--wecom-surface); }
    .wecom-rail {
      grid-column: 1;
      grid-row: 1 / -1;
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-height: 0;
      padding: 11px 5px calc(9px + env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
      border-right: 1px solid var(--wecom-divider);
      background: #fbfcfe;
    }
    .rail-item { display: grid; flex: none; justify-items: center; align-content: center; gap: 4px; width: 100%; min-height: 48px; padding: 3px 0; border: 0; border-radius: 8px; background: transparent; color: #647287; font-size: 11px; line-height: 1.25; white-space: nowrap; }
    .rail-item[aria-hidden="true"] { color: #778396; }
    .rail-item .icon { width: 22px; height: 22px; }
    .rail-item:where(button):hover { background: #f2f7ff; }
    .rail-item[aria-current="page"] { color: var(--wecom-blue-pressed); font-weight: 700; background: #edf5ff; }
    .rail-app-icon { display: grid; place-items: center; }
    .wecom-content { padding: 19px 16px 16px; }
    .panel-heading { display: flex; align-items: center; gap: 9px; margin-bottom: 14px; }
    .panel-icon { display: grid; place-items: center; flex: none; width: 35px; height: 35px; border-radius: 9px; background: #e6f1ff; color: var(--wecom-blue-pressed); }
    .panel-heading h1 { font-size: 23px; line-height: 1.2; }
    .workbench-app { display: flex; align-items: center; gap: 11px; width: 100%; padding: 13px; border: 1px solid var(--wecom-divider); border-radius: 12px; background: #fff; color: var(--ink); text-align: left; }
    .workbench-app:hover { border-color: #accdf5; background: #f7fbff; }
    .workbench-app strong { display: block; font-size: 14px; }
    .workbench-app small { display: block; color: var(--muted); margin-top: 4px; }
    .search-panel { padding: 12px; margin-bottom: 12px; border: 1px solid var(--wecom-divider); border-radius: 12px; background: #fff; }
    .wecom-window .searchbox { padding: 0 10px; border: 1px solid transparent; border-radius: 9px; background: var(--wecom-surface); }
    .wecom-window .searchbox:focus-within { border-color: #a5cafa; box-shadow: 0 0 0 2px #1677e81a; }
    .wecom-window .searchbox input { height: 42px; font-size: 16px; }
    .wecom-window #company-submit { min-height: 44px; min-width: 56px; border-radius: 9px; font-size: 14px; }
    .wecom-window #company-submit:not(:disabled) { background: var(--wecom-blue); }
    .wecom-window #company-submit:not(:disabled):hover { background: var(--wecom-blue-pressed); }
    .label { display: block; color: var(--ink); font-size: 12px; font-weight: 670; margin-bottom: 7px; }
    .search-row { display: flex; gap: 7px; }
    .searchbox { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; padding: 0 9px; border: 1px solid var(--stroke); border-radius: 7px; background: #fff; color: var(--muted); }
    .searchbox:focus-within { border-color: #648def; box-shadow: 0 0 0 3px #2658d614; }
    .searchbox input { width: 100%; min-width: 0; height: 34px; padding: 0; outline: none; border: 0; background: transparent; color: var(--ink); font-size: 12px; }
    .searchbox input::placeholder { color: #72839a; }

    .button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 35px; border: 1px solid transparent; border-radius: 7px; padding: 6px 11px; white-space: nowrap; font-size: 12px; font-weight: 670; }
    .button.primary { background: var(--blue); color: #fff; }
    .button.primary:hover { background: var(--blue-strong); }
    .button.primary:disabled { background: #e5ebf5; color: #5a6e89; cursor: default; }
    .button.outline { border-color: var(--stroke); background: #fff; color: var(--sub); }
    .button.outline:hover { background: #f4f8ff; color: var(--blue-strong); }
    .button.danger { background: #a9363d; color: #fff; }
    .button.danger:hover { background: #8e2832; }
    #company-results { min-width: 0; }
    .section-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .company-heading h2 { font-size: 15px; overflow-wrap: anywhere; }
    .company-heading p, .table-sub { margin-top: 4px; color: var(--muted); font-size: 11px; }
    select { max-width: 100%; min-height: 32px; border: 1px solid var(--stroke); border-radius: 6px; padding: 0 7px; background: #fff; color: var(--sub); font-size: 11px; }

    .wecom-window .table-panel { border-color: var(--wecom-divider); border-radius: 12px; }
    .wecom-window .table-panel .section-top { flex-wrap: nowrap; align-items: flex-start; gap: 8px; padding: 13px 12px; }
    .wecom-window .company-heading h2 { font-size: 14px; line-height: 1.4; }
    .wecom-window #company-filter { min-height: 36px; }
    .wecom-window .table-wrap td.person { white-space: normal; }
    .company-table, .company-table tbody { display: block; }
    .company-table thead { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .company-table tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr) auto; grid-template-areas: "name status action" "phone customer customer" "contact company company"; gap: 4px 8px; align-items: start; padding: 9px 12px 12px; border-top: 1px solid var(--wecom-divider); }
    .company-table td { min-width: 0; padding: 0; border: 0; line-height: 1.4; }
    .company-table [data-label="用户名称"] { grid-area: name; align-self: center; color: var(--ink); font-size: 15px; }
    .company-table [data-label="状态"] { grid-area: status; align-self: center; }
    .company-table [data-label="操作"] { grid-area: action; }
    .company-table [data-label="用户手机号码"] { grid-area: phone; }
    .company-table [data-label="Customer ID"] { grid-area: customer; }
    .company-table [data-label="contactid"] { grid-area: contact; }
    .company-table [data-label="公司名称"] { grid-area: company; color: var(--sub); font-size: 11px; overflow-wrap: anywhere; }
    .company-table :is(.mono, .company-name-cell)::before { content: attr(data-label); display: block; font-family: system-ui, sans-serif; color: var(--muted); font-size: 10px; }
    .company-table [data-label="用户手机号码"]::before { content: "手机号"; }
    .company-table .row-action { min-height: 40px; padding: 5px 9px; background: #edf5ff; color: var(--wecom-blue-pressed); border-radius: 7px; }
    .company-table .row-action:hover { background: #dcecff; }
    .company-table .empty { grid-column: 1 / -1; padding: 18px 0; }
    body:has(#company-view:not([hidden])) #action-dialog { border-radius: 17px; }
    body:has(#company-view:not([hidden])) #action-dialog .button { min-height: 44px; }
    body:has(#company-view:not([hidden])) #toast { right: auto; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); }
    .mono { color: #435572; font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; }
    .badge { display: inline-flex; align-items: center; white-space: nowrap; gap: 5px; border-radius: 20px; padding: 3px 7px; font-size: 10px; font-weight: 680; line-height: 1.4; }
    .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge.bound { background: var(--green-pale); color: var(--green); }
    .badge.open { background: #edf1f6; color: #4f6178; }
    .row-action { font-size: 12px; font-weight: 650; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--blue-strong); padding: 5px 6px; white-space: nowrap; }
    .row-action:hover { background: var(--blue-pale); }
    .row-action.danger { color: var(--red); }
    .row-action.danger:hover { background: #fff0f1; }
    .empty { padding: 27px 10px; text-align: center; color: var(--muted); font-size: 12px; }
    .empty strong { display: block; font-size: 13px; color: var(--ink); margin-bottom: 5px; }

    .admin-shell { min-height: calc(100vh - 59px); display: grid; grid-template-columns: 208px minmax(0, 1fr); grid-template-rows: auto 1fr; background: #f4f6f8; }
    .admin-top { grid-column: 1 / -1; min-height: 60px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 26px; }
    .admin-brand { display: flex; align-items: center; gap: 9px; font-weight: 750; letter-spacing: -.01em; font-size: 16px; }
    .admin-brand span { display: grid; place-items: center; flex: none; width: 31px; height: 31px; border-radius: 7px; background: #ce5c43; color: #fff; }
    .admin-role { flex: none; color: var(--sub); font-size: 12px; }
    .admin-nav { padding: 22px 12px; background: #f0f4f8; border-right: 1px solid var(--line); }
    .admin-nav-group, .admin-nav-item { display: flex; align-items: center; gap: 9px; padding: 9px 11px; border-radius: 6px; font-size: 12px; white-space: nowrap; }
    .admin-nav-group { font-weight: 700; }
    .admin-nav-item { padding-left: 36px; color: var(--sub); }
    .admin-nav-item.sub { padding-left: 47px; }
    .admin-nav-item.active { color: var(--admin-accent); background: var(--admin-pale); font-weight: 680; }
    .admin-main { min-width: 0; padding: 25px clamp(17px, 3vw, 38px); }
    .breadcrumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; color: var(--muted); font-size: 12px; margin-bottom: 16px; }
    .breadcrumbs strong { color: var(--admin-accent); font-weight: 700; }
    .admin-page-heading { margin-bottom: 16px; }
    .admin-page-heading p { font-size: 12px; color: var(--muted); margin-top: 5px; }
    .table-panel { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .table-panel .section-top { padding: 15px 16px; }
    .relation-tools { display: flex; align-items: center; gap: 6px; }
    .relation-tools .searchbox { max-width: 232px; }
    .relation-tools .searchbox input { height: 32px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    thead { background: #ecf1f7; color: #3c5068; }
    th, td { padding: 11px 10px; vertical-align: middle; }
    th { font-size: 11px; font-weight: 690; white-space: nowrap; }
    td { border-top: 1px solid #edf0f5; font-size: 12px; }
    td.mono, td.person { white-space: nowrap; }
    td.person { font-weight: 640; }
    th:first-child, td:first-child { padding-left: 16px; }
    th:last-child, td:last-child { padding-right: 16px; }
    tbody tr:hover { background: #fbfcff; }
    .table-foot { padding: 11px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11px; }
    .clear-text { margin-left: 4px; color: var(--muted); font-family: inherit; font-size: 10px; }
    .muted { color: var(--muted); }
    dialog { max-width: min(calc(100% - 24px), 450px); width: 100%; max-height: calc(100% - 24px); padding: 0; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); box-shadow: 0 15px 70px #182c543e; }
    dialog::backdrop { background: #101f3c65; }
    .dialog-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 18px 18px 8px; }
    .dialog-head h2 { font-size: 17px; }
    .icon-button { background: transparent; border: 0; border-radius: 5px; color: var(--muted); padding: 4px; display: grid; place-items: center; }
    .icon-button:hover { background: #f0f4fb; color: var(--ink); }
    .dialog-body { padding: 0 18px 14px; color: var(--sub); line-height: 1.6; }
    .dialog-body p { margin: 0 0 10px; }
    .dialog-body p:last-child { margin-bottom: 0; }
    .details { margin: 0; border: 1px solid var(--line); border-radius: 7px; background: #f7f9fd; padding: 4px 10px; }
    .details div { display: flex; gap: 8px; justify-content: space-between; padding: 6px 0; }
    .details div + div { border-top: 1px solid var(--line); }
    .details dt { font-size: 12px; color: var(--muted); }
    .details dd { margin: 0; color: var(--ink); font-weight: 620; text-align: right; }
    .dialog-footer { display: flex; justify-content: flex-end; gap: 7px; padding: 10px 18px 14px; border-top: 1px solid var(--line); }
    .toast { position: fixed; right: 18px; bottom: 17px; z-index: 2; display: flex; align-items: flex-start; gap: 8px; width: max-content; max-width: min(calc(100% - 30px), 380px); padding: 10px 12px; border: 1px solid var(--line); border-left: 4px solid var(--green); border-radius: 7px; background: #fff; box-shadow: 0 6px 25px #1c315b23; line-height: 1.5; }
    .toast[data-type="error"] { border-left-color: var(--amber); }
    .toast .icon { color: var(--green); margin-top: 1px; }
    .toast[data-type="error"] .icon { color: var(--amber); }
    .toast strong, .toast span { display: block; }
    .toast span { color: var(--sub); font-size: 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .flow-page { max-width: 936px; margin: 0 auto; padding: 28px 24px 38px; }
    .flow-page > header { margin-bottom: 17px; }
    .flow-page h1 { font-size: 29px; }
    .flow-page > header p { margin-top: 5px; color: var(--sub); font-size: 13px; }
    .flow-board {
      --flow-line: #8798ad;
      --flow-return: #5377a7;
      --flow-gap: 14px;
      position: relative;
      margin: 0;
      padding: 24px 38px 15px;
      border: 1px solid #dce5ef;
      border-radius: 20px;
      background: linear-gradient(180deg, #f9fbfe, #fff 290px);
      box-shadow: 0 12px 36px #263b5e0d;
    }
    .flow-connections { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--flow-line); pointer-events: none; }
    .flow-connections .flow-return { color: var(--flow-return); }
    #flow-return-arrow { stroke-dasharray: 5 4; }
    .flow-steps { display: grid; gap: var(--flow-gap); margin: 0; padding: 0; list-style: none; }
    .flow-trunk { width: min(100%, 310px); margin-inline: auto; }
    .flow-step {
      position: relative;
      display: grid;
      align-content: center;
      gap: 4px;
      min-height: 46px;
      padding: 9px 13px;
      border: 1px solid #dbe4ef;
      border-radius: 9px;
      background: #fff;
      line-height: 1.42;
    }
    .flow-step + .flow-step::before, .flow-branch .flow-step:first-child::before {
      content: "";
      position: absolute;
      top: calc(0px - var(--flow-gap));
      left: calc(50% - .5px);
      width: 1px;
      height: calc(var(--flow-gap) - 1px);
      background: var(--flow-line);
    }
    .flow-step + .flow-step::after, .flow-branch .flow-step:first-child::after {
      content: "";
      position: absolute;
      top: -6px;
      left: calc(50% - 2.5px);
      width: 5px;
      height: 5px;
      transform: rotate(45deg);
      border-right: 1px solid var(--flow-line);
      border-bottom: 1px solid var(--flow-line);
    }
    .flow-step strong { color: var(--ink); font-size: 14px; }
    .flow-step small { color: var(--sub); font-size: 11px; }
    .flow-system {
      display: inline-grid;
      place-items: center;
      min-height: 24px;
      padding: 2px 4px;
      border-radius: 6px;
      background: var(--branch-accent, #eaf1fb);
      color: var(--branch-ink, #315d91);
      font-size: 11px;
      font-weight: 750;
    }
    .flow-trunk .flow-step, .flow-branch.missing .flow-step { grid-template-columns: 43px minmax(0, 1fr); align-items: center; column-gap: 10px; }
    .flow-question {
      position: relative;
      display: grid;
      place-items: center;
      width: min(100%, 222px);
      min-height: 76px;
      margin: 15px auto 0;
      background: #86a2c8;
      clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
      color: #20466f;
      font-size: 15px;
      font-weight: 750;
      text-align: center;
    }
    .flow-question::before {
      content: "";
      position: absolute;
      inset: 1.5px 4px;
      background: #eaf2fd;
      clip-path: inherit;
    }
    .flow-question span { position: relative; }
    .flow-branches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 34px; padding-top: 28px; }
    .flow-branch {
      --branch-accent: #e8f4f0;
      --branch-border: #c8e2d8;
      --branch-ink: #1a6550;
      min-width: 0;
    }
    .flow-branch.missing { --branch-accent: #edf0fa; --branch-border: #d7dff3; --branch-ink: #405987; }
    .flow-branch h2 {
      width: fit-content;
      margin: 0 auto var(--flow-gap);
      padding: 4px 14px;
      border-radius: 20px;
      background: var(--branch-accent);
      color: var(--branch-ink);
      font-size: 12px;
    }
    .flow-branch .flow-end { border-color: var(--branch-border); background: var(--branch-accent); }
    .flow-branch .flow-end strong { color: var(--branch-ink); }
    .flow-key {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      padding: 5px 8px;
      border-radius: 6px;
      background: #f3f7f9;
      text-align: center;
    }
    .flow-key span { color: var(--sub); font-size: 11px; overflow-wrap: anywhere; }
    .flow-key b { color: var(--branch-ink); }
    .flow-key code { margin-left: 3px; color: #234965; font-family: ui-monospace, monospace; }
    .flow-board figcaption { margin-top: 17px; color: var(--muted); font-size: 11px; }

    const contacts = [

      { id: "LD-5209", customerId: "041089" },
      ...additionalContacts.map(({ leadId, customerId }) => ({ id: leadId, customerId }))
    ];
    const storageKey = "xinuo.sales-relation-demo.v1";
    const timestamp = new Intl.DateTimeFormat("zh-CN", {
      timeZone: "Asia/Shanghai", month: "2-digit", day: "2-digit", hour: "2-digit",
      minute: "2-digit", hourCycle: "h23"
    });

    const $ = (selector) => document.querySelector(selector);
    const companyName = (contact) => companies.find((company) => company.id === contact.companyId).name;
    const icon = (name, size = "") => `<svg class="icon ${size}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const escapeHtml = (value) => String(value ?? "—").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
    })[char]);
    const searchText = (value) => String(value ?? "").normalize("NFKC").toLocaleLowerCase();
    const includes = (value, term) => searchText(value).includes(term);
    const contactById = (id) => contacts.find((contact) => contact.id === id);
    const contactByRelation = (relationId) => contacts.find((contact) => contact.relationId === relationId);
    const matchingLeads = (id) => id ? leads.filter((lead) => lead.customerId === id) : [];
    const formatTime = (value) => {
      if (!value) return "—";
      const parts = Object.fromEntries(timestamp.formatToParts(new Date(value)).map(({ type, value }) => [type, value]));
      return `${parts.month}-${parts.day} ${parts.hour}:${parts.minute}`;
    };

    function initialData() {
      return {
        relations: Object.fromEntries(contacts.map((contact) => {
          const leadId = contact.initialLeadId ?? null;
          return [contact.relationId, {
            customerId: leadId ? contact.customerId : null,
            leadId,
            modifiedAt: leadId ? "2026-11-11T10:20:00+08:00" : null
          }];
        })),
        simulatedFailures: {}
      };
    }

    function readData() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (saved?.relations && saved?.simulatedFailures) {
          const restored = { relations: saved.relations, simulatedFailures: saved.simulatedFailures };
          const hasNewRows = contacts.some((contact) => !saved.relations[contact.relationId]);
          if (hasNewRows) {
            const defaults = initialData().relations;
            restored.relations = Object.fromEntries(
              contacts.map(({ relationId }) => [relationId, saved.relations[relationId] ?? defaults[relationId]])
            );
          }
          if (hasNewRows || "failures" in saved) persistData(restored);
          return restored;
        }
      } catch {
        // The preview can run with storage disabled.
      }
      return initialData();
    }

    let data = readData();
    let selectedCompanyId = null;
    let matchedCompanies = [];
    let companyFilter = "all";
    let companyQuery = "";
    let activeView = "company";
    let currentAction;
    let toastTimer;

    function persistData(state) {
      try {
        localStorage.setItem(storageKey, JSON.stringify(state));
      } catch {
        // Changes are still available for the current page.
      }
    }

    function isBound(record) {
      return Boolean(record.customerId && record.leadId);
    }

    function matchesStatus(record, filter) {
      if (filter === "all") return true;
      return isBound(record) === (filter === "bound");
    }

    function badge(bound) {
      return bound ? '<span class="badge bound">已关联</span>' : '<span class="badge open">未关联</span>';
    }

    function cell(label, markup, classes = "") {
      return `<td class="${classes}" data-label="${label}">${markup}</td>`;
    }



    function companyContactRow(contact) {
      const bound = isBound(data.relations[contact.relationId]);
      const action = bound ? "查看关系" : "关联关系";
      const actionButton = `<button class="row-action" type="button" data-action="${bound ? "view" : "bind"}" data-contact="${contact.id}" aria-label="${action} · ${escapeHtml(contact.name)}">${action}</button>`;
      return `<tr data-contact-id="${contact.id}">
        ${cell("Customer ID", escapeHtml(contact.customerId), "mono")}
        ${cell("用户名称", escapeHtml(contact.name), "person")}
        ${cell("用户手机号码", escapeHtml(contact.phone), "mono")}
        ${cell("contactid", escapeHtml(contact.id), "mono")}
        ${cell("公司名称", escapeHtml(companyName(contact)), "company-name-cell")}
        ${cell("状态", badge(bound))}
        ${cell("操作", actionButton)}
      </tr>`;
    }

    function renderCompanyChoices(container) {
      const rows = matchedCompanies.map((company) => {
        const count = contacts.filter((contact) => contact.companyId === company.id).length;
        return `<tr>
          <td class="person">${escapeHtml(company.name)}</td>
          <td>${count}</td>
          <td><button class="row-action" data-company="${company.id}" type="button" aria-label="查看人员 · ${escapeHtml(company.name)}">查看人员</button></td>
        </tr>`;
      }).join("");
      container.innerHTML = `
        <div class="table-panel">
          <div class="section-top"><div class="company-heading"><h2>匹配的公司</h2><p>找到 ${matchedCompanies.length} 家公司</p></div></div>
          <div class="table-wrap">
            <table aria-label="匹配的公司列表">
              <thead><tr><th scope="col">公司名称</th><th scope="col">人员数量</th><th scope="col">操作</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>`;
    }

    function renderCompany() {
      const container = $("#company-results");
      container.hidden = !companyQuery;
      if (!companyQuery) {
        container.innerHTML = "";
        return;
      }

      const company = companies.find((entry) => entry.id === selectedCompanyId);
      if (!company) {
        if (matchedCompanies.length) {
          renderCompanyChoices(container);
        } else {
          container.innerHTML = '<div class="table-panel empty"><strong>未找到匹配公司</strong>请核对公司名称后重新查询。</div>';
        }
        return;
      }

      const companyContacts = contacts.filter((contact) => contact.companyId === company.id);
      const filtered = companyContacts.filter((contact) => matchesStatus(data.relations[contact.relationId], companyFilter));
      const boundCount = companyContacts.filter((contact) => isBound(data.relations[contact.relationId])).length;
      const rows = filtered.map(companyContactRow).join("") ||
        '<tr><td class="empty" colspan="7"><strong>当前状态下暂无人员</strong>可切换筛选条件查看。</td></tr>';
      container.innerHTML = `
        <div class="table-panel">
          <div class="section-top">
            <div class="company-heading"><h2>${escapeHtml(company.name)}</h2><p>显示 ${filtered.length} / ${companyContacts.length} 位 · ${boundCount} 位已关联</p></div>
            <div><label class="sr-only" for="company-filter">筛选人员关联状态</label><select id="company-filter"><option value="all">全部状态</option><option value="bound">已关联</option><option value="open">未关联</option></select></div>
          </div>
          <div class="table-wrap">
            <table class="company-table" role="table" aria-label="公司人员列表">
              <thead><tr><th scope="col">Customer ID</th><th scope="col">用户名称</th><th scope="col">用户手机号码</th><th scope="col">contactid</th><th scope="col">公司名称</th><th scope="col">状态</th><th scope="col">操作</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>`;
      $("#company-filter").value = companyFilter;
    }
    function renderRelations() {
      const term = searchText($("#relation-input").value.trim());
      const filter = $("#relation-filter").value;
      const filtered = contacts.filter((contact) => {
        const record = data.relations[contact.relationId];
        const values = [contact.relationId, contact.oneId, contact.unionId, contact.name, companyName(contact), record.customerId, record.leadId];
        return matchesStatus(record, filter) && values.some((value) => includes(value, term));
      });
      const linkedCount = contacts.filter((contact) => isBound(data.relations[contact.relationId])).length;
      $("#relation-count").textContent = `${contacts.length} 条记录 · ${linkedCount} 条已关联`;
      $("#relation-page-count").textContent = `显示 ${filtered.length} / ${contacts.length} 条记录`;
      $("#relation-rows").innerHTML = filtered.map((contact) => {
        const record = data.relations[contact.relationId];
        const bound = isBound(record);
        const customerValue = record.customerId ? escapeHtml(record.customerId) :
          `—${record.modifiedAt ? '<span class="clear-text">已清空</span>' : ""}`;
        const operation = bound
          ? `<button class="row-action danger" type="button" data-unbind="${contact.relationId}" aria-label="解绑 · ${escapeHtml(contact.name)}">解绑</button>`
          : '<span class="muted">—</span>';
        return `<tr data-relation-id="${contact.relationId}">
          ${cell("OneID", escapeHtml(contact.oneId), "mono")}
          ${cell("customerid", customerValue, "mono")}
          ${cell("unionid", escapeHtml(contact.unionId), "mono")}
          ${cell("用户名称", escapeHtml(contact.name), "person")}
          ${cell("关联线索", escapeHtml(record.leadId), "mono")}
          ${cell("状态", badge(bound))}
          ${cell("最近修改", formatTime(record.modifiedAt), "mono")}
          ${cell("操作", operation)}
        </tr>`;
      }).join("") || '<tr><td class="empty" colspan="8"><strong>未找到对应关系</strong>可修改搜索词或状态筛选。</td></tr>';
    }

    function searchCompany(query) {
      companyQuery = query.trim();
      const keyword = searchText(companyQuery);
      matchedCompanies = keyword ? companies.filter((company) => includes(company.name, keyword)) : [];
      selectedCompanyId = matchedCompanies.length === 1 ? matchedCompanies[0].id : null;
      companyFilter = "all";
      renderCompany();
    }


    function showView(view) {
      activeView = view;
      for (const name of ["company", "relation", "flow"]) {
        const active = name === view;
        $(`#${name}-view`).hidden = !active;
        const nav = $(`#nav-${name}`);
        if (active) nav.setAttribute("aria-current", "page");
        else nav.removeAttribute("aria-current");
      }
      if (view === "relation") renderRelations();
      else if (view === "company") renderCompany();
      clearTimeout(toastTimer);
      $("#toast").hidden = true;
      window.scrollTo(0, 0);
    }

    function showViewFromHash() {
      const routes = { "#wecom": "company", "#admin": "relation", "#flow": "flow" };
      showView(routes[window.location.hash] ?? "company");
    }

    function openWecomPage(page, focusSearch = false) {
      const isCompany = page === "company";
      $("#wecom-company-page").hidden = !isCompany;
      $("#wecom-workbench").hidden = isCompany;
      const selectedButton = isCompany ? "#wecom-company-button" : "#wecom-workbench-button";
      const otherButton = isCompany ? "#wecom-workbench-button" : "#wecom-company-button";
      $(selectedButton).setAttribute("aria-current", "page");
      $(otherButton).removeAttribute("aria-current");
      clearTimeout(toastTimer);
      $("#toast").hidden = true;
      if (focusSearch) $("#company-input").focus();
    }

    function notify(title, detail, type = "success") {
      const toast = $("#toast");
      clearTimeout(toastTimer);
      toast.dataset.type = type;
      const description = detail ? `<span>${escapeHtml(detail)}</span>` : "";
      toast.innerHTML = `${icon(type === "error" ? "alert" : "check")}<div><strong>${escapeHtml(title)}</strong>${description}</div>`;
      toast.hidden = false;
      toastTimer = setTimeout(() => { toast.hidden = true; }, 6500);
    }

    function openDialog({ title, intro, details = [], confirm, danger = false, run }) {
      currentAction = run;
      $("#dialog-title").textContent = title;
      const items = details.map(([key, value]) => `<div><dt>${escapeHtml(key)}</dt><dd>${escapeHtml(value)}</dd></div>`).join("");
      $("#dialog-content").innerHTML = `<p>${escapeHtml(intro)}</p>${items ? `<dl class="details">${items}</dl>` : ""}`;
      const button = $("#dialog-confirm");
      button.textContent = confirm;
      button.className = `button ${danger ? "danger" : "primary"}`;
      $("#dialog-cancel").hidden = !run;
      $("#action-dialog").showModal();
      if (!run) button.focus();
    }

    function bindContact(contact) {
      const record = data.relations[contact.relationId];
      if (isBound(record)) {
        notify("该记录已关联", `关联线索 ${record.leadId}`);
        return;
      }

      const candidates = matchingLeads(contact.customerId);
      const simulateFailure = candidates.length === 1 &&
        contact.simulateWriteFailure && !data.simulatedFailures[contact.id];

      if (simulateFailure) {
        data.simulatedFailures[contact.id] = true;
        persistData(data);
      }
      if (candidates.length !== 1 || simulateFailure) {
        notify("关联失败", "", "error");
        return;
      }

      data.relations[contact.relationId] = {
        customerId: contact.customerId,
        leadId: candidates[0].id,
        modifiedAt: new Date().toISOString()
      };
      persistData(data);
      renderCompany();
      notify("关联成功", `已关联到线索 ${candidates[0].id}。`);
      const rowAction = $(`[data-contact="${contact.id}"]`);
      if (rowAction) rowAction.focus({ preventScroll: true });
      else $("#company-filter").focus({ preventScroll: true });
    }

    function confirmBind(contact) {
      openDialog({
        title: "关联关系",
        intro: "系统将使用该人员的 Customer ID 匹配并关联市场线索。",
        details: [["用户名称", contact.name], ["公司名称", companyName(contact)], ["Customer ID", contact.customerId ?? "缺失"]],
        confirm: "确认关联",
        run: () => bindContact(contact)
      });
    }

    function confirmUnbind(contact) {
      const record = data.relations[contact.relationId];
      const expectedVersion = record.modifiedAt;
      openDialog({
        title: "解绑对应关系",
        intro: "确认后将清空当前记录的 customerid，解除对应的线索关联。企微人员资料仍可用于再次关联。",
        details: [["用户名称", contact.name], ["对应关系记录", contact.relationId], ["Customer ID", record.customerId], ["关联线索", record.leadId]],
        confirm: "确认解绑",
        danger: true,
        run: () => {
          const latest = data.relations[contact.relationId];
          if (latest.modifiedAt !== expectedVersion || !isBound(latest)) {
            renderRelations();
            notify("对应关系已更新", "请核对当前记录后重试。", "error");
            return;
          }
          data.relations[contact.relationId] = { customerId: null, leadId: null, modifiedAt: new Date().toISOString() };
          persistData(data);
          renderRelations();
          $("#relation-input").focus({ preventScroll: true });
          notify("解绑成功", `记录 ${contact.relationId} 的 customerid 已清空。`);
        }
      });
    }

    $("#company-input").value = "";
    $("#wecom-workbench-button").addEventListener("click", () => openWecomPage("workbench"));
    $("#wecom-company-button").addEventListener("click", () => openWecomPage("company", true));
    $("#wecom-app-tile").addEventListener("click", () => openWecomPage("company", true));
    $("#company-form").addEventListener("submit", (event) => {
      event.preventDefault();
      searchCompany($("#company-input").value);
    });
    $("#company-input").addEventListener("input", (event) => {
      const keyword = event.target.value.trim();
      $("#company-submit").disabled = !keyword;
      if (companyQuery && keyword !== companyQuery) searchCompany("");
    });
    $("#company-results").addEventListener("change", (event) => {
      if (event.target.id === "company-filter") {
        companyFilter = event.target.value;
        renderCompany();
        $("#company-filter").focus({ preventScroll: true });
      }
    });
    $("#company-results").addEventListener("click", (event) => {
      const companyButton = event.target.closest("[data-company]");
      const actionButton = event.target.closest("[data-action]");
      if (companyButton) {
        selectedCompanyId = companyButton.dataset.company;
        renderCompany();
        $("#company-filter").focus({ preventScroll: true });
      }
      if (actionButton) {
        const contact = contactById(actionButton.dataset.contact);
        if (actionButton.dataset.action === "view") {
          openDialog({
            title: "关联详情",
            intro: "该人员已关联市场线索。",
            details: [["用户名称", contact.name], ["公司名称", companyName(contact)], ["Customer ID", contact.customerId]],
            confirm: "关闭"
          });
        } else {
          confirmBind(contact);
        }
      }
    });
    $("#relation-input").addEventListener("input", renderRelations);
    $("#relation-filter").addEventListener("change", renderRelations);
    $("#relation-rows").addEventListener("click", (event) => {
      const button = event.target.closest("[data-unbind]");
      if (button) confirmUnbind(contactByRelation(button.dataset.unbind));
    });
    window.addEventListener("hashchange", showViewFromHash);
    $("#dialog-close").addEventListener("click", () => $("#action-dialog").close());
    $("#dialog-cancel").addEventListener("click", () => $("#action-dialog").close());
    $("#dialog-confirm").addEventListener("click", () => {
      const run = currentAction;
      $("#action-dialog").close();
      if (run) run();
    });
    $("#action-dialog").addEventListener("close", () => { currentAction = null; });
    $("#reset-demo").addEventListener("click", () => openDialog({
      title: "重置演示数据",
      intro: "确认后，本浏览器的演示数据会恢复为初始示例。",
      confirm: "确认重置",
      run: () => {
        data = initialData();
        persistData(data);
        $("#company-input").value = "";
        $("#company-submit").disabled = true;
        searchCompany("");
        $("#relation-input").value = "";
        $("#relation-filter").value = "all";
        showView(activeView);
        notify("演示数据已重置", "可重新体验查询、关联和解绑。");
      }
    }));
    window.addEventListener("storage", (event) => {
      if (event.key !== storageKey) return;
      data = readData();
      if (activeView === "relation") renderRelations();
      else if (activeView === "company") renderCompany();
    });
    showViewFromHash();

    if ("ResizeObserver" in window) {
      const board = $(".flow-board");
      const connections = $(".flow-connections");
      const returnArrow = $("#flow-return-arrow");
      const queryArrow = $("#flow-query-arrow");
      const branchConnections = [
        { label: $("#flow-has-users"), arrow: $("#flow-has-users-arrow") },
        { label: $("#flow-no-users"), arrow: $("#flow-no-users-arrow") }
      ];
      const sfCreateStep = $("#flow-sf-create");
      const sfPullStep = $("#flow-sf-pull");
      const queryStep = $("#flow-query");
      const questionStep = $("#flow-question");
      new ResizeObserver(() => {
        const canvas = connections.getBoundingClientRect();
        if (!canvas.width) return;
        const bounds = (element) => {
          const rect = element.getBoundingClientRect();
          const left = rect.left - canvas.left;
          const top = rect.top - canvas.top;
          return { left, top, right: left + rect.width, bottom: top + rect.height, x: left + rect.width / 2, y: top + rect.height / 2 };
        };
        const pull = bounds(sfPullStep);
        const create = bounds(sfCreateStep);
        const query = bounds(queryStep);
        const question = bounds(questionStep);
        const branchBend = question.bottom + 11;
        const stacked = window.matchMedia("(max-width: 680px)").matches;
        const gutter = canvas.width - 13;
        const radius = 7;

        returnArrow.setAttribute("d", [
          `M ${create.right} ${create.y} H ${gutter - radius}`,
          `Q ${gutter} ${create.y} ${gutter} ${create.y - radius}`,
          `V ${pull.y + radius} Q ${gutter} ${pull.y} ${gutter - radius} ${pull.y}`,
          `H ${pull.right + 1}`
        ].join(" "));
        queryArrow.setAttribute("d", `M ${question.x} ${query.bottom} V ${question.top - 1}`);
        branchConnections.forEach(({ label, arrow }, index) => {
          const branch = bounds(label);
          const direction = index === 0 ? -1 : 1;
          const entry = stacked
            ? `H 17 Q 10 ${branchBend} 10 ${branchBend + radius} V ${branch.y - radius} Q 10 ${branch.y} 17 ${branch.y} H ${branch.left - 1}`
            : `H ${branch.x - direction * radius} Q ${branch.x} ${branchBend} ${branch.x} ${branchBend + radius} V ${branch.top - 1}`;
          arrow.setAttribute("d", `M ${question.x} ${question.bottom} V ${branchBend} ${entry}`);
        });
      }).observe(board);
    }
  </script>
</body>
</html>
